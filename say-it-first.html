const mine={};let rec=null,recKey=null,stream=null,recChunks=[],micMsg='';

function adjAr(a,boy){return a.ar[boy?'m':'f'];} function adjZh(a,boy){return a.zh[boy?'m':'f'];}
function makePrompt(kind){
  const g=S.g;
  if(kind&&kind.startsWith('intro:')){const it=D.intro.find(x=>x.k===kind.slice(6));
    return {kind:'intro',title:'Part 1: Introduce yourself',qAr:it.q[g],qEn:it.enq,cue:`<div class="cue"><span class="emo">${({name:'🪪',from:'🌍',live:'🏠',grade:'🔢',school:'🏫'})[it.k]}</span></div>`,
      mAr:it.a[g],mZh:it.za[g],mEn:it.ena,mCn:it.cna,ids:['q_'+it.k,'a_'+it.k],hint:it.k==='from'?'Say your own country. Find it in Learn: My country and grade.':'Say your own answer.'};}
  if(kind==='pers'){const [a,b]=shuffle(D.adj).slice(0,2),q=D.more[0];
    return {kind,title:'Part 2: Personality',qAr:pick(q.q),qEn:q.enq,cue:`<div class="cue"><span class="emo">🙋</span><img alt="" src="${IMG[a.img]}"><span class="emo">↔️</span><img alt="" src="${IMG[b.img]}"><span class="emo">❌</span></div>`,
      mAr:'أَنَا '+a.ar[g]+' وَلَكِن لَستُ '+b.ar[g]+'.',mZh:'安纳  '+a.zh[g]+'  瓦拉金  拉斯图  '+b.zh[g],mEn:'I am '+a.en+' but I am not '+b.en+'.',mCn:'我'+a.cn+'，但是我不'+b.cn+'。',ids:['adj_'+a.k,'adj_'+b.k,'f_pers'],hint:'Say what you are (first picture) and what you are not (second picture).'};}
  if(kind==='like'||kind==='yn'){const h=rnd(D.hob),r=rnd(D.rea),like=Math.random()<.5,m=g==='m';
    const body=(like?'أُحِبُّ ':'لَا أُحِبُّ ')+h.ar+' لِأَنَّهَا '+r.ar+'.';
    const bz=(like?'乌*希*布  ':'拉  乌*希*布  ')+h.zh+'  利安纳哈  '+r.zh;const be=(like?'I like ':'I do not like ')+h.en+' because it is '+r.en+'.';const bc=(like?'我喜欢':'我不喜欢')+h.cn+'，因为它很'+r.cn+'。';
    const cue=`<div class="cue"><img alt="" src="${IMG[like?'up':'down']}"><img alt="" src="${IMG[h.img]}"><span class="emo">🔗</span><img alt="" src="${IMG[r.img]}"></div>`;
    if(kind==='like'){const q=D.more[1];return {kind,title:'Part 2: Hobbies',qAr:pick(q.q),qEn:q.enq,cue,mAr:body,mZh:bz,mEn:be,mCn:bc,ids:['hob_'+h.k,'rea_'+r.k,like?'f_like':'f_dislike','f_because'],hint:'Say what you like or do not like, and why.'};}
    return {kind,title:'Part 2: Yes or no',qAr:(m?'هَل تُحِبُّ ':'هَل تُحِبِّينَ ')+h.ar+'؟ لِمَاذَا؟',qEn:'Do you like '+h.en+'? Why?',cue,mAr:(like?'نَعَم، ':'لَا، ')+body,mZh:(like?'纳*阿*姆,  ':'拉,  ')+bz,mEn:(like?'Yes, ':'No, ')+be.charAt(0).toLowerCase()+be.slice(1),mCn:(like?'是的，':'不，')+bc,ids:['hob_'+h.k,'rea_'+r.k,like?'a_yes':'a_no'],hint:'Say yes or no, then give a reason.'};}
  if(kind==='card'){const idx=shuffle([0,1,2,3,4,5]),a=D.adj[idx[0]],b=D.adj[idx[1]],boy=Math.random()<.5,f=boy?'m':'f';
    return {kind,title:'Part 3: Describe a person',qAr:null,qEn:'Tell me about this person.',cue:profileHTML(a,b,boy),
      mAr:(boy?'هُوَ ':'هِيَ ')+a.ar[f]+' وَلَكِن '+(boy?'لَيسَ ':'لَيسَت ')+b.ar[f]+'.',mZh:(boy?'胡瓦  ':'希亚  ')+a.zh[f]+'  瓦拉金  '+(boy?'莱萨  ':'莱萨[特]  ')+b.zh[f],mEn:(boy?'He':'She')+' is '+a.en+' but '+(boy?'he':'she')+' is not '+b.en+'.',mCn:(boy?'他':'她')+a.cn+'，但是不'+b.cn+'。',ids:['adj_'+a.k,'adj_'+b.k,boy?'f_he':'f_she'],hint:'✓ means is. ✗ means is not.'};}
}
function profileHTML(pos,neg,boy){const f=boy?'m':'f';
  return `<div class="profile"><div class="r"><img alt="" src="${IMG[pos.img]}"><span class="mk y" aria-label="is">✓</span></div><div class="r"><img alt="" src="${IMG[neg.img]}"><span class="mk n" aria-label="is not">✗</span></div></div><div class="sub" style="margin:0">${boy?'👦 a boy':'👧 a girl'}</div>`;}
function promptHTML(P,idx,n,label){

  <div class="cardbig t-intro" style="padding:12px">
    ${P.qAr?`<button class="btn sun wide" style="width:100%" data-say="${esc(P.qAr)}">🔊 Hear the question</button>`:`<div class="en" style="font-weight:800">${esc(P.qEn)}</div>`}
    ${P.cue}<div class="sub" style="margin:0">${esc(P.hint)}</div></div>

/* ---------- TALK ---------- */
const T={reply:null,build:{i:0,turns:[],done:false}};
function talkHTML(){
  let h=`<div class="chips2" role="group" aria-label="Mode"><button class="pill" data-sub="reply" aria-pressed="${S.sub==='reply'}">Hear and reply</button><button class="pill" data-sub="build" aria-pressed="${S.sub==='build'}">Build and say</button></div>`;

  else h+=buildTalkHTML();
  return h;
}
function nextReply(){return makePrompt(rnd(['intro:name','intro:from','intro:live','intro:grade','intro:school','pers','like','yn','card']));}

/* build and say */
function buildTurns(){const b=T.build;b.turns=[{kind:'pers'},{kind:'hobby'},{kind:'yn'},{kind:'card'}];b.i=0;b.done=false;}
function buildTalkHTML(){
  const b=T.build;if(!b.turns.length)buildTurns();
  if(b.done)return `<div class="stage"><h2>Well done! 🎉</h2><p>Now say each sentence again without looking.</p><div class="acts"><button class="btn wide" data-act="brestart">Build more</button></div></div>`;
  const t=b.turns[b.i];if(!t.init)initBuild(t);_key='b'+b.i+t.kind;
  const cue=t.kind==='card'?profileHTML(D.adj[t.pos],D.adj[t.neg],t.boy):t.kind==='yn'?`<div class="cue"><span class="emo">❓</span><img alt="" src="${IMG[t.h.img]}"></div>`:`<div class="cue"><span class="emo">❓</span></div>`;
  const qline=t.kind==='card'?'Tell me about this person.':t.kind==='pers'?'What is your personality?':t.kind==='hobby'?'What do you like? Why?':'Do you like '+t.h.en+'? Why?';
  let h=`${NOTE}<div class="stage">${dotsHTML(b.i,b.turns.length)}<div class="cardbig t-intro" style="padding:12px">${t.q?`<button class="btn sun" style="width:100%" data-say="${esc(t.q)}">🔊 Hear the question</button>`:''}<div class="en" style="font-weight:800">${esc(qline)}</div>${cue}</div>`;
  if(t.kind==='pers'||t.kind==='hobby')h+=`<div style="margin-top:10px"><label class="pill" style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" data-act="challenge" ${t.challenge?'checked':''}> Challenge: add وَلَكِن</label></div>`;
  h+=`<p class="sub" style="margin:10px 0 0">Tap the pictures to build your answer.</p><div class="slots" id="slots">${slotsHTML(t)}</div><div class="optrow" id="choices">${choicesHTML(t)}</div>
  <div class="acts"><button class="btn" data-act="check" ${t.fill.every(x=>x!==null)?'':'disabled'}>✅ Check</button><button class="btn alt" data-act="clear">Clear</button></div><div id="fb"></div></div>`;
  return h;
}
function initBuild(t){t.init=true;t.challenge=false;const g=S.g;
  if(t.kind==='card'){t.boy=Math.random()<.5;const idx=shuffle([0,1,2,3,4,5]);t.pos=idx[0];t.neg=idx[1];}
  if(t.kind==='yn'){t.h=rnd(D.hob);}
  setSlots(t);
  t.q=t.kind==='pers'?pick(D.more[0].q):t.kind==='hobby'?pick(D.more[1].q):t.kind==='yn'?((g==='m'?'هَل تُحِبُّ ':'هَل تُحِبِّينَ ')+t.h.ar+'؟ لِمَاذَا؟'):null;}
function setSlots(t){const TK=D.TK;let s=[];
  if(t.kind==='pers')s=[{f:TK.ana,emo:'🙋'},{c:'adj'},{f:TK.walakin,emo:'↔️'},{f:TK.lastu,emo:'❌'},{c:'adj'}];
  else if(t.kind==='hobby'){s=[{c:'like'},{c:'hobby'},{f:TK.because,emo:'🔗'},{c:'reason'}];if(t.challenge)s=s.concat([{f:TK.walakin,emo:'↔️'},{c:'like'},{c:'hobby'},{f:TK.because,emo:'🔗'},{c:'reason'}]);}
  else if(t.kind==='yn')s=[{c:'yn'},{c:'like'},{f:{ar:t.h.ar,zh:t.h.zh,img:t.h.img}},{f:TK.because,emo:'🔗'},{c:'reason'}];
  else s=[{f:t.boy?TK.he:TK.she,emo:t.boy?'👦':'👧'},{c:'adj'},{f:TK.walakin,emo:'↔️'},{f:t.boy?TK.laysa:TK.laysat,emo:'❌'},{c:'adj'}];
  t.slots=s;t.fill=s.map(x=>x.c?null:x.f);t.slots.forEach((x,i)=>{if(!x.c&&x.emo&&t.fill[i])t.fill[i]=Object.assign({},t.fill[i],{emo:x.emo});});}
function optionsFor(t,kind){
  if(kind==='adj'){const f=t.kind==='card'?(t.boy?'m':'f'):S.g;return D.adj.map(a=>({ar:a.ar[f],zh:a.zh[f],img:a.img,key:a.k}));}
  if(kind==='hobby')return D.hob.map(a=>({ar:a.ar,zh:a.zh,img:a.img,key:a.k}));
  if(kind==='reason')return D.rea.map(a=>({ar:a.ar,zh:a.zh,img:a.img,key:a.k}));
  if(kind==='like')return [{ar:D.TK.like.ar,zh:D.TK.like.zh,img:'up',key:'like'},{ar:D.TK.dislike.ar,zh:D.TK.dislike.zh,img:'down',key:'dislike'}];
  if(kind==='yn')return [{ar:D.TK.yes.ar,zh:D.TK.yes.zh,emo:'👍',key:'yes'},{ar:D.TK.no.ar,zh:D.TK.no.zh,emo:'👎',key:'no'}];return [];}
const tileInner=v=>(v.img?`<img alt="" src="${IMG[v.img]}">`:(v.emo?`<span class="emo">${v.emo}</span>`:''))+`<span class="ar">${esc(v.ar)}</span>`;
function slotsHTML(t){const act=t.fill.findIndex(x=>x===null);
  return t.slots.map((s,i)=>{const v=t.fill[i];
    if(v===null)return `<button class="slot blank ${i===act?'active':''}" data-slot="${i}" aria-label="empty">?</button>`;
    return `<button class="slot ${s.f?'fixed':''}" ${s.f?'disabled':`data-slot="${i}"`}>${tileInner(v)}</button>`;}).join('');}
function choicesHTML(t){const act=t.fill.findIndex(x=>x===null);if(act<0)return '<span class="sub">All filled. Tap Check.</span>';
  return optionsFor(t,t.slots[act].c).map((o,k)=>`<button class="opt" data-choice="${k}">${tileInner(o)}</button>`).join('');}
function evalBuild(t){const f=t.fill;const sent={ar:f.map(x=>x.ar).join(' '),zh:f.map(x=>x.zh).join('  ')};let ok=true,msg='',en='';
  if(t.kind==='pers'){if(f[1].key===f[4].key){ok=false;msg='Choose two different pictures: what you are, and what you are not.';}else{const a=D.adj.find(x=>x.k===f[1].key),b=D.adj.find(x=>x.k===f[4].key);en='I am '+a.en+' but I am not '+b.en+'.';msg='Yes! You said what you are and what you are not.';}}
  else if(t.kind==='hobby'){const parts=[];for(let i=0;i<f.length;i++)if(t.slots[i].c==='like')parts.push({l:f[i].key==='like',h:f[i+1],r:f[i+3]});
    if(parts.length===2&&parts[0].h.key===parts[1].h.key){ok=false;msg='Use two different hobbies.';}else{en=parts.map(p=>(p.l?'I like ':'I do not like ')+D.hob.find(x=>x.k===p.h.key).en+' because it is '+D.rea.find(x=>x.k===p.r.key).en).join(', but ')+'.';msg='Yes! A hobby and a reason.';}}
  else if(t.kind==='yn'){const yes=f[0].key==='yes',like=f[1].key==='like';if(yes!==like){ok=false;msg=yes?'You chose 👍 yes, so use the thumbs-up أُحِبُّ.':'You chose 👎 no, so use the thumbs-down لَا أُحِبُّ.';}else{en=(yes?'Yes, I like ':'No, I do not like ')+t.h.en+' because it is '+D.rea.find(x=>x.k===f[4].key).en+'.';msg='Yes! Your answer matches the question.';}}
  else{const a=D.adj[t.pos],b=D.adj[t.neg],m=[];if(f[1].key!==a.k)m.push('Look at the ✓ picture.');if(f[4].key!==b.k)m.push('Look at the ✗ picture.');if(m.length){ok=false;msg=m.join(' ')+' ✓ is. ✗ is not.';}else{en=(t.boy?'He':'She')+' is '+a.en+' but '+(t.boy?'he':'she')+' is not '+b.en+'.';msg='Yes! The right pictures for ✓ and ✗.';}}
  return {ok,msg,en,sent};}

/* ---------- LISTEN quiz ---------- */
const Q={i:0,n:10,score:0,items:[],done:false};
function newQuiz(){Q.i=0;Q.score=0;Q.done=false;Q.items=[];
  for(let k=0;k<Q.n;k++){const type=['adj','sentence','question','hobby'][k%4];
    if(type==='adj'){const c=rnd(D.adj);Q.items.push({type,say:pick(c.ar),title:'Which picture do you hear?',opts:shuffle([c,...shuffle(D.adj.filter(x=>x!==c)).slice(0,2)]).map(x=>({img:x.img,right:x===c}))});}
    else if(type==='hobby'){const c=rnd(D.hob);Q.items.push({type:'adj',say:c.ar,title:'Which picture do you hear?',opts:shuffle([c,...shuffle(D.hob.filter(x=>x!==c)).slice(0,2)]).map(x=>({img:x.img,right:x===c}))});}
    else if(type==='sentence'){const h=rnd(D.hob),r=rnd(D.rea),like=Math.random()<.5,mk=(hh,rr,ll)=>({h:hh,r:rr,l:ll}),c=mk(h,r,like);
      const w=[mk(rnd(D.hob.filter(x=>x!==h)),r,like),mk(h,rnd(D.rea.filter(x=>x!==r)),like),mk(h,r,!like)];
      Q.items.push({type,say:(like?'أُحِبُّ ':'لَا أُحِبُّ ')+h.ar+' لِأَنَّهَا '+r.ar+'.',title:'Which row do you hear?',opts:shuffle([c,...shuffle(w).slice(0,2)]).map(x=>Object.assign({},x,{right:x===c}))});}
    else{const it=rnd(D.intro);Q.items.push({type,say:pick(it.q),title:'Which picture matches the question?',opts:shuffle([it,...shuffle(D.intro.filter(x=>x!==it)).slice(0,2)]).map(x=>({k:x.k,right:x===it}))});}}}
const EMO={name:'🪪',from:'🌍',live:'🏠',grade:'🔢',school:'🏫'};
function listenHTML(){if(!Q.items.length)newQuiz();
  if(Q.done)return `<div class="stage" style="text-align:center"><h2>Your score</h2><div class="score">${Q.score} / ${Q.n}</div><p>${Q.score>=8?'Excellent listening! 🎉':Q.score>=5?'Good. Play again to beat your score.':'Keep listening. Try Learn first, then play again.'}</p><div class="acts"><button class="btn wide" data-act="qrestart">Play again</button></div></div>`;
  const it=Q.items[Q.i];
  return `${NOTE}<div class="stage">${dotsHTML(Q.i,Q.n)}<h2>${it.title}</h2><button class="btn sun" style="width:100%" data-act="qplay">🔊 Listen</button><div class="opts" id="qo">${it.opts.map((o,k)=>{

    return `<button class="opt" data-q="${k}"><span class="emo" style="font-size:56px">${EMO[o.k]}</span></button>`;}).join('')}</div><div id="fb"></div></div>`;}

/* ---------- TEST ---------- */
const X={i:0,seq:[],res:[],done:false,started:false};
function newTest(){X.seq=['intro:name','intro:from','intro:live','intro:grade','intro:school','pers','like','yn','card','card'].map(k=>makePrompt(k));X.i=0;X.res=[];X.done=false;X.started=true;}
function testHTML(){
  if(!X.started)return `<h2>Test me 🎯</h2><p class="sub">Ten prompts, like the real speaking test: five questions about you, a conversation, and two person cards. Say each answer out loud, then check the model and rate yourself. Nothing is marked: this is your private practice.</p><div class="acts"><button class="btn wide" data-act="tstart">Start the test</button></div>`;
  if(X.done){const good=X.res.filter(Boolean).length;
    const parts=[['Part 1',0,5],['Part 2',5,8],['Part 3',8,10]];
    return `<div class="stage"><h2>Done! 🎉</h2><div class="score">${good} / ${X.seq.length} said confidently</div>${parts.map(p=>{const s=X.res.slice(p[1],p[2]).filter(Boolean).length;return `<div class="sumrow"><b>${p[0]}</b><span>${s} of ${p[2]-p[1]} ${s===p[2]-p[1]?'✅':'→ practise again'}</span></div>`;}).join('')}<div class="acts"><button class="btn" data-tab="learn">Practise words</button><button class="btn alt" data-act="tstart">Test again</button></div></div>`;}

  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
  showNote();refreshRecUI();
}
function syncTools(){$('#gm').setAttribute('aria-pressed',S.g==='m');$('#gf').setAttribute('aria-pressed',S.g==='f');$('#tzh').setAttribute('aria-pressed',S.zh);$('#tcn').setAttribute('aria-pressed',S.cn);$('#tslow').setAttribute('aria-pressed',S.slow);
  document.body.classList.toggle('no-zh',!S.zh);document.body.classList.toggle('no-cn',!S.cn);$('#stars').textContent='⭐ '+S.stars;}
function curPrompt(){return S.tab==='talk'?T.reply:X.seq[X.i];}
function stopAll(){turnTok++;if(hasTTS)speechSynthesis.cancel();}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,input');if(!t)return;
  if(t.dataset.say){say(t.dataset.say,t);return;}
  if(t.id==='gm'||t.id==='gf'){S.g=t.id==='gm'?'m':'f';store.set('g',S.g);syncTools();T.reply=null;T.build.turns=[];X.started=false;render();return;}
  if(t.id==='tzh'){S.zh=!S.zh;store.set('zh',S.zh);syncTools();return;}
  if(t.id==='tcn'){S.cn=!S.cn;store.set('cn',S.cn);syncTools();return;}
  if(t.id==='tslow'){S.slow=!S.slow;store.set('slow',S.slow);syncTools();return;}
  if(t.dataset.tab){stopAll();S.tab=t.dataset.tab;if(S.tab!=='learn')S.set=S.set;render();window.scrollTo(0,0);return;}
  if(t.dataset.open){const it=byId[t.dataset.open];S.tab='learn';S.set=it.set;S.idx=ITEMS.filter(i=>i.set===it.set).findIndex(i=>i.id===it.id);render();window.scrollTo(0,0);return;}
  if(t.dataset.set){S.set=t.dataset.set;S.idx=0;render();window.scrollTo(0,0);return;}
  if(t.dataset.sub){stopAll();S.sub=t.dataset.sub;render();return;}
  const act=t.dataset.act;
  if(act==='sets'){stopAll();S.set=null;render();return;}
  if(act==='prev'){stopAll();S.idx=Math.max(0,S.idx-1);render();return;}
  if(act==='next'){stopAll();const n=ITEMS.filter(i=>i.set===S.set).length;S.idx=Math.min(n-1,S.idx+1);render();return;}
  if(act==='rec'){toggleRec(curKey());return;}
  if(act==='compare'){const k=curKey();const p=S.tab==='learn'?byId[k]:curPrompt();const ar=S.tab==='learn'?pick(p.ar):p.mAr;await say(ar);await sleep(300);await playMine(k);return;}
  if(act==='pieces'){const it=ITEMS.filter(i=>i.set===S.set)[S.idx];pieces(pick(it.ar),t);return;}
  if(act==='pieces2'){pieces(curPrompt().mAr,t);return;}
  if(t.dataset.rate){const it=ITEMS.filter(i=>i.set===S.set)[S.idx];rate([it.id],t.dataset.rate==='yes');if(t.dataset.rate==='yes'&&S.idx<ITEMS.filter(i=>i.set===S.set).length-1)S.idx++;render();return;}
  if(act==='reveal'){const P=curPrompt();$('#reveal').innerHTML=revealHTML(P);say(P.mAr);return;}
  if(t.dataset.rate2){const P=curPrompt();const yes=t.dataset.rate2==='yes';rate(P.ids,yes);stopAll();
    if(S.tab==='test'){X.res.push(yes);if(X.i<X.seq.length-1)X.i++;else X.done=true;render();window.scrollTo(0,0);}
    else{T.reply=nextReply();render();window.scrollTo(0,0);}return;}
  if(act==='newreply'){stopAll();T.reply=nextReply();render();return;}
  if(act==='tstart'){newTest();render();window.scrollTo(0,0);return;}
  if(act==='qrestart'){newQuiz();render();return;}
  if(act==='brestart'){buildTurns();render();return;}
  if(act==='qplay'){say(Q.items[Q.i].say,t);return;}
  if(act==='challenge'){const tt=T.build.turns[T.build.i];tt.challenge=t.checked;setSlots(tt);render();return;}
  const bt=()=>T.build.turns[T.build.i];
  if(t.dataset.slot!==undefined){const tt=bt(),i=+t.dataset.slot;if(tt.slots[i].c){tt.fill[i]=null;rer();}return;}
  if(t.dataset.choice!==undefined){const tt=bt();const a=tt.fill.findIndex(x=>x===null);const o=optionsFor(tt,tt.slots[a].c)[+t.dataset.choice];tt.fill[a]=o;say(o.ar);rer();return;}
  if(act==='clear'){const tt=bt();tt.fill=tt.slots.map((s,i)=>s.c?null:s.f);tt.slots.forEach((x,i)=>{if(!x.c&&x.emo&&tt.fill[i])tt.fill[i]=Object.assign({},tt.fill[i],{emo:x.emo});});rer();return;}
  if(act==='check'){const tt=bt();const r=evalBuild(tt);tt.last=r;
    $('#fb').innerHTML=`<div class="fb ${r.ok?'good':'bad'}">${esc(r.msg)}${r.ok?`<div class="ar" style="font-size:30px;margin-top:6px">${esc(r.sent.ar)}</div><div class="zh">${zhH(r.sent.zh)}</div><div style="font-weight:700">${esc(r.en)}</div>`:''}</div>${r.ok?'<div class="acts"><button class="btn sun" data-act="hear">🔊 Listen</button><button class="btn alt" data-act="bpieces">🧩 In pieces</button><div class="turn" id="turn" style="grid-column:1/-1"></div><button class="btn alt" data-act="rec">🎤 Say it</button><button class="btn" data-act="bnext">Next →</button></div><div class="note" id="micMsg" hidden></div>':''}`;
    if(r.ok){addStars(2);say(r.sent.ar);_key='b'+T.build.i+tt.kind;}else{$('#fb').firstChild.classList.add('shake');}return;}
  if(act==='hear'){say(bt().last.sent.ar,t);return;}
  if(act==='bpieces'){pieces(bt().last.sent.ar,t);return;}
  if(act==='bnext'){stopAll();const b=T.build;if(b.i<b.turns.length-1)b.i++;else b.done=true;render();window.scrollTo(0,0);return;}
  if(t.dataset.q!==undefined){const it=Q.items[Q.i],o=it.opts[+t.dataset.q];
    if(!it.answered){it.answered=true;if(o.right){Q.score++;addStars(1);t.classList.add('ok');}else{t.classList.add('no','shake');const idx=it.opts.findIndex(x=>x.right);$('#qo').children[idx].classList.add('ok');}
      $('#fb').innerHTML=`<div class="fb ${o.right?'good':'bad'}">${o.right?'Correct! 🎉':'Not this time. The right one is marked.'}<div class="ar" style="font-size:24px">${esc(it.say)}</div></div><div class="acts"><button class="btn sun" data-say="${esc(it.say)}">🔊 Listen again</button><button class="btn wide" data-act="qnext">${Q.i<Q.n-1?'Next':'See score'}</button></div>`;}return;}
  if(act==='qnext'){stopAll();if(Q.i<Q.n-1)Q.i++;else Q.done=true;render();return;}
});
function rer(){const tt=T.build.turns[T.build.i];$('#slots').innerHTML=slotsHTML(tt);$('#choices').innerHTML=choicesHTML(tt);const c=document.querySelector('[data-act="check"]');if(c)c.disabled=!tt.fill.every(x=>x!==null);$('#fb').innerHTML='';}
syncTools();render();
})();
</script>
</body>
</html>
